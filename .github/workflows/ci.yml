name: DevOps Automation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify project files
        run: |
          test -f index.html
          test -f Dockerfile
          echo "Project files verified successfully."

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t devops-automation-lab:${{ github.sha }} .

      - name: Confirm Docker image
        run: |
          docker image inspect devops-automation-lab:${{ github.sha }}
          echo "Docker image built successfully."

      - name: Run application container
        run: |
          docker run -d \
            --name devops-web-test \
            -p 8080:80 \
            devops-automation-lab:${{ github.sha }}

      - name: Application smoke test
        run: |
          sleep 3
          curl --fail http://localhost:8080
          echo "Application smoke test passed."

      - name: Stop test container
        if: always()
        run: |
          docker stop devops-web-test || true
          docker rm devops-web-test || true
